# Publishes @lab34/flows to npm when a release is created.
#
# The same gates a pull request has to clear are re-run here, against the exact
# commit being released: a release must not ship code that is untested, below
# the coverage threshold, or carrying a critical advisory.

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        # Enforces the 80% threshold from jest.config.js.
        run: npm run test:coverage

      - name: Audit (root)
        run: npm audit --audit-level=critical

      - name: Audit (frontend)
        run: npm audit --audit-level=critical --prefix frontend

      - name: Build
        run: npm run build

      - name: Check the CLI starts from the compiled output
        run: node dist/cli.js --help

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      # prepublishOnly compiles src/ into dist/, which is what "files" ships.
      - run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
